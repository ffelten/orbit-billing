[project]
name = "orbit"
version = "0.1.0"
description = "Subscription billing API"
readme = "README.md"
authors = [
    { name = "ffelten", email = "felten.florian@hotmail.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings required only on non-trivial public APIs, not enforced blanket
    "COM812",  # conflicts with ruff format
    "ISC001",  # conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]  # assert and literal comparisons are expected in tests

[tool.pytest.ini_options]
addopts = ["-q"]
asyncio_mode = "auto"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true
